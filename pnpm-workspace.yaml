packages:
  # all packages in direct subdirs of packages/
  - 'packages/*'
  # all packages in subdirs of components/
  - 'components/**'
  # exclude packages that are inside test directories
  - '!**/test/**'

virtualStoreDirMaxLength: 120

hoistPattern:
  - '*'

publicHoistPattern:
  - '*eslint*'
  - '*prettier*'

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  zod: 4.1.12

allowBuilds:
  sharp: true
